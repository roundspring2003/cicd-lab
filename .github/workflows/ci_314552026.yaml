name: CI Pipeline 314552026

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: TypeScript typecheck
      - name: TypeScript typecheck
        run: npm run typecheck

      # Step 5: Prettier format check
      - name: Prettier format check
        run: npm run format:check

      # Step 6: Run tests
      - name: Run tests
        run: npm run test

      # Step 7: Upload test results
      - name: Upload test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: 'dist/coverage/**/*.xml'
          reporter: 'java-junit'
          fail-on-error: true
        continue-on-error: true

      # Step 8: Test summary
      - name: Test Summary
        if: always()
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "✓ TypeScript typecheck passed" >> $GITHUB_STEP_SUMMARY
          echo "✓ Prettier format check passed" >> $GITHUB_STEP_SUMMARY
          echo "✓ Tests passed" >> $GITHUB_STEP_SUMMARY
